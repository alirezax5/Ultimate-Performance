# ============================================================
# Ultimate Performance — Sample Nginx Configuration
# ============================================================
# This is a GENERIC SAMPLE configuration showing how to integrate
# Ultimate Performance with Nginx for direct web-server cache
# HITs (zero PHP on cached requests).
#
# This file is intended as a reference / starting point.
# Replace all <PLACEHOLDER> values with your own site's values.
#
# IMPORTANT: Do NOT paste this entire file into nginx.conf.
# Use the plugin's admin UI (Settings → Ultimate Performance →
# Server Integration → "Generate Nginx rules") to get a tailored
# snippet for YOUR specific site, then adapt as needed.
# ============================================================
#
# Architecture:
#
#   request → nginx → if-cacheable (rewrite to /up-cache/<host><path>/index.html)
#                    ↓ MISS or skip-cache
#                    location ^~ /up-cache/ (try_files /index.php fallback)
#                                  ↓
#                                  PHP-FPM (WordPress generates + caches page)
#
# Cache HITs never touch PHP — pure nginx serving from disk.
# Cache MISSes run WordPress once, capture the HTML, write it
# to /up-cache/, and serve it. Subsequent requests get the HIT.
# ============================================================
#
# Placeholders to replace:
#   <SITE_HOST>         → your domain (e.g. example.com)
#   <DOCROOT>           → absolute path to WordPress docroot (e.g. /var/www/example.com)
#   <CACHE_ROOT>        → absolute path to Ultimate Performance cache directory
#                         (usually <DOCROOT>/wp-content/cache/ultimate-performance)
#   <PHP_FPM_SOCK>      → PHP-FPM unix socket or TCP address (e.g. /var/run/php/php8.2-fpm.sock)
#   <SSL_CERT_PATH>     → path to SSL certificate
#   <SSL_KEY_PATH>      → path to SSL private key
# ============================================================

# ------------------------------------------------------------
# 1. Per-site server block — usually lives in
#    /etc/nginx/conf.d/<site>.conf or
#    /www/server/panel/vhost/nginx/<site>.conf (aaPanel/BT Panel)
# ------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <SITE_HOST>;

    root <DOCROOT>;
    index index.php index.html index.htm;

    # SSL certificate paths
    ssl_certificate     <SSL_CERT_PATH>;
    ssl_certificate_key <SSL_KEY_PATH>;

    # --------------------------------------------------------
    # 1a. Skip-cache flag (server scope)
    # --------------------------------------------------------
    # Set to 1 if request is dynamic (POST, logged-in, cart, etc.)
    # Used by the conditional rewrite below to decide whether
    # to attempt a cache lookup.
    # --------------------------------------------------------
    set $up_skip_cache 0;

    # Don't cache POST requests
    if ($request_method = POST) {
        set $up_skip_cache 1;
    }

    # Don't cache logged-in users / WooCommerce sessions / cart-holding requests
    # IMPORTANT: this regex matches the cookie NAME pattern. WordPress sets
    # wordpress_logged_in_<32-hex>, wordpress_sec_<32-hex>, etc. WooCommerce
    # sets woocommerce_items_in_cart, woocommerce_cart_hash, wp_woocommerce_session_<id>.
    if ($http_cookie ~* "wordpress_logged_in_|comment_author_|wp-postpass_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|wordpress_sec_") {
        set $up_skip_cache 1;
    }

    # Don't cache dynamic WordPress / WooCommerce URLs
    if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-cron\.php|/xmlrpc\.php|/wp-json/|/cart/|/checkout/|/my-account/|/wc-api/|/wc-ajax/") {
        set $up_skip_cache 1;
    }

    # Don't cache requests with query strings (search results, etc.)
    if ($is_args) {
        set $up_skip_cache 1;
    }

    # --------------------------------------------------------
    # 1b. Conditional rewrite — runs in the rewrite phase,
    #     BEFORE location matching. Sends cacheable requests
    #     to the internal /up-cache/ location.
    # --------------------------------------------------------
    if ($up_skip_cache = 0) {
        # Root path: maps to <cache_root>/v/<SITE_HOST>/uc-root/index.html
        rewrite ^/?$ /up-cache/<SITE_HOST>/uc-root/index.html last;
        # Other paths: /<path>/ maps to <cache_root>/v/<SITE_HOST>/<path>/index.html
        rewrite ^/(.+)/$ /up-cache/<SITE_HOST>/$1/index.html last;
        # Paths without trailing slash (rare, but handle it)
        rewrite ^/(.+)$ /up-cache/<SITE_HOST>/$1/index.html last;
    }

    # --------------------------------------------------------
    # 1c. Internal-only cache serving location
    # --------------------------------------------------------
    # The plugin writes cached HTML to:
    #   <CACHE_ROOT>/v/<SITE_HOST>/<path>/index.html
    # The /up-cache/ prefix is INTERNAL — never directly exposed.
    # --------------------------------------------------------
    location ^~ /up-cache/ {
        internal;
        alias <CACHE_ROOT>/v/;
        default_type text/html;
        add_header X-Ultimate-Performance "HIT" always;
        add_header X-Cache-Status "HIT" always;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
        # If cached file exists, serve it; otherwise fall through to PHP origin
        try_files $uri /index.php?$args;
    }

    # --------------------------------------------------------
    # 1d. Main location — try static file, then PHP fallback
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --------------------------------------------------------
    # 1e. PHP handling — direct .php file access (wp-admin etc.)
    # --------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass <PHP_FPM_SOCK>;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --------------------------------------------------------
    # 1f. Static asset caching (images, CSS, JS, fonts)
    # --------------------------------------------------------
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|bmp|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------
    # 1g. wp-admin / wp-login / wp-cron / xmlrpc — always bypass cache
    # --------------------------------------------------------
    location ~ ^/(wp-admin|wp-login\.php|wp-cron\.php|xmlrpc\.php) {
        fastcgi_pass <PHP_FPM_SOCK>;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --------------------------------------------------------
    # 1h. WooCommerce / cart / checkout — always bypass cache
    # --------------------------------------------------------
    location ~ ^/(cart|checkout|my-account|wc-api|wc-ajax) {
        fastcgi_pass <PHP_FPM_SOCK>;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING $args;
    }

    # --------------------------------------------------------
    # 1i. Security: deny direct access to cache metadata files
    # --------------------------------------------------------
    location ~* /wp-content/cache/ultimate-performance/(meta|tmp|genlocks|stats|\.htaccess) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/<SITE_HOST>.log;
    error_log  /var/log/nginx/<SITE_HOST>.error.log;
}

# ------------------------------------------------------------
# 2. HTTP → HTTPS redirect
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <SITE_HOST>;
    return 301 https://$host$request_uri;
}
